<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#0b1119">
<title>美式八球 · Canvas 台球</title>
<link rel="stylesheet" href="css/base.css">
<link rel="stylesheet" href="css/layout.css">
<link rel="stylesheet" href="css/rack.css">
<link rel="stylesheet" href="css/panel.css">
<link rel="stylesheet" href="css/overlay.css">
<link rel="stylesheet" href="css/responsive.css">
</head>
<body>
<div class="app">

  <header>
    <div class="brand">
      <h1>美式八球</h1>
      <span class="tag">CANVAS POOL</span>
    </div>
  </header>

  <div class="main">
    <div class="stage">
      <div class="table-col">
        <!-- 台面上方：球组分类与球号，定组后标记归属 -->
        <div class="rack-strip">
          <div class="group-panel" id="panelSolid">
            <div class="gp-head">
              <span class="gp-owner" id="ownerSolid">球组待定</span>
              <span class="gp-tag">纯色 1-7</span>
            </div>
            <div class="chips" id="chipsSolid"></div>
          </div>
          <div class="group-panel" id="panelStripe">
            <div class="gp-head">
              <span class="gp-owner" id="ownerStripe">球组待定</span>
              <span class="gp-tag">花色 9-15</span>
            </div>
            <div class="chips" id="chipsStripe"></div>
          </div>
        </div>

        <div class="canvas-wrap">
          <canvas id="table"></canvas>
          <div id="toast"></div>
        </div>
      </div>
    </div>

    <aside class="panel">
      <!-- 对局设置：模式与电脑难度，放在最上面；切换后即时开局 -->
      <div class="card setup-card">
        <div class="seg-row">
          <span class="seg-label">模式</span>
          <div class="seg" id="modeSeg">
            <button type="button" class="active" data-mode="pvp">本地双人</button>
            <button type="button" data-mode="ai">人机对战</button>
            <button type="button" data-mode="auto">电脑互打</button>
          </div>
        </div>
        <!-- 电脑 1（只在电脑互打时出现） -->
        <div class="seg-row" id="level0Row" hidden>
          <span class="seg-label">电脑 1</span>
          <div class="seg" id="levelSeg0">
            <button type="button" data-level0="easy">简单</button>
            <button type="button" class="active" data-level0="normal">普通</button>
            <button type="button" data-level0="hard">困难</button>
          </div>
        </div>
        <!-- 难度：人机对战里指电脑；电脑互打里指电脑 2 -->
        <div class="seg-row" id="levelRow" hidden>
          <span class="seg-label" id="levelLabel">难度</span>
          <div class="seg" id="levelSeg">
            <button type="button" data-level="easy">简单</button>
            <button type="button" class="active" data-level="normal">普通</button>
            <button type="button" data-level="hard">困难</button>
          </div>
        </div>
        <!-- 电脑互打：暂停 / 继续观战 -->
        <button type="button" class="btn auto-btn" id="btnAutoPause" hidden>暂停观战</button>
      </div>

      <div class="card status-card">
        <div class="status-line">
          <span class="dot" id="turnDot"></span>
          <span id="statusText">玩家 1 击球</span>
          <span class="clock" id="clockText">00:00</span>
        </div>
        <div class="sub" id="statusSub">向母球反方向拖动瞄准，松手击球</div>
      </div>

      <div class="card">
        <div class="power-head"><span>力度</span><span id="powerVal">0%</span></div>
        <div class="power-track"><div class="power-fill" id="powerFill"></div></div>
      </div>

      <div class="card btn-card">
        <button type="button" class="btn" id="btnRestart">重新开局</button>
        <button type="button" class="btn" id="btnReplay" disabled>上一杆回放</button>
        <button type="button" class="btn" id="btnSound">音效：开</button>
        <button type="button" class="btn danger" id="btnClear">清空战绩</button>
      </div>

      <div class="card">
        <div class="rec-head"><span>本地战绩</span><span id="recHint">localStorage</span></div>
        <div class="rec-list" id="recordsBody"></div>
      </div>
    </aside>
  </div>
</div>

<div class="modal" id="modal">
  <div class="modal-box">
    <h2 id="modalTitle"></h2>
    <p id="modalText"></p>
    <div class="modal-actions" id="modalActions"></div>
  </div>
</div>

<script src="js/config.js"></script>
<script src="js/util.js"></script>
<script src="js/state.js"></script>
<script src="js/balls.js"></script>
<script src="js/canvas.js"></script>
<script src="js/render.js"></script>
<script src="js/physics.js"></script>
<script src="js/aim.js"></script>
<script src="js/input.js"></script>
<script src="js/rules.js"></script>
<script src="js/score.js"></script>
<script src="js/ai.js"></script>
<script src="js/sound.js"></script>
<script src="js/replay.js"></script>
<script src="js/hud.js"></script>
<script src="js/loop.js"></script>
<script src="js/main.js"></script>
</body>
</html>
