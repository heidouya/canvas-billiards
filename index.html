<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#0b1119">
<title>美式八球 · Canvas 台球</title>
<style>
/* ============================================================
 * 页面基础样式
 * ============================================================ */
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;padding:0}
body{
  min-height:100vh;
  padding:14px;
  font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Hiragino Sans GB","Microsoft YaHei",sans-serif;
  color:#e6eff8;
  background:radial-gradient(1200px 800px at 50% -20%,#1a2f46 0%,#0a0f16 60%,#070a0f 100%);
  -webkit-font-smoothing:antialiased;
}
/* 铺满可视宽度：球桌尽量放大，右侧面板贴到窗口右边 */
.app{width:100%;max-width:none;display:flex;flex-direction:column;gap:12px}

/* ---------- 顶部：标题 + 模式切换 ---------- */
header{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap}
.brand{display:flex;align-items:baseline;gap:10px}
.brand h1{margin:0;font-size:20px;letter-spacing:3px;font-weight:700}
.brand .tag{font-size:12px;color:#6f8aa6;letter-spacing:1px}

.controls{display:flex;gap:10px;flex-wrap:wrap}
.seg{display:flex;padding:3px;border-radius:12px;background:#0f1722;border:1px solid #1d2b3c;box-shadow:inset 0 1px 0 rgba(255,255,255,.03)}
/* hidden 属性要能压过 .seg 的 display:flex（本地双人时隐藏难度按钮） */
.seg[hidden]{display:none}
.seg button{
  appearance:none;border:0;background:transparent;color:#93a9bf;
  font-size:13px;padding:7px 14px;border-radius:9px;cursor:pointer;
  transition:background .18s,color .18s,transform .1s;white-space:nowrap;
}
.seg button:hover{color:#dceaf7}
.seg button:active{transform:scale(.97)}
.seg button.active{background:linear-gradient(180deg,#2f9d6c,#1b6b47);color:#fff;font-weight:600;box-shadow:0 2px 8px rgba(31,140,95,.35)}

/* ---------- 主区域 ---------- */
.main{display:flex;gap:18px;align-items:flex-start}
/* 舞台占满剩余宽度，桌子在其中水平居中（不能用 flex 容器，否则 canvas 的固有宽度会成为 min-content 撑破窄屏） */
.stage{flex:1 1 auto;min-width:0}

/* 画布容器：固定 1120:620 比例，等比缩放不拉伸 */
.canvas-wrap{
  position:relative;
  width:100%;
  max-width:100%;
  margin:0 auto;
  padding:10px;
  border-radius:18px;
  background:linear-gradient(180deg,#0e1621,#080c12);
  border:1px solid #1b2837;
  box-shadow:0 24px 60px rgba(0,0,0,.55),inset 0 1px 0 rgba(255,255,255,.04);
}
/* 宽屏：桌子宽度同时受可用宽度和窗口高度约束（1.8065 = 1120/620） */
@media (min-width:941px){
  .canvas-wrap{width:min(100%, calc((100vh - 128px) * 1.8065))}
  .canvas-wrap{width:min(100%, calc((100dvh - 128px) * 1.8065))}
}
/* 关键：width 100% + height auto，画布按自身位图比例缩放，永不拉伸 */
canvas{
  display:block;width:100%;height:auto;
  border-radius:12px;
  touch-action:none;cursor:crosshair;
  background:#0a0f14;
}

/* 画布上的浮层提示（犯规、回放等） */
#toast{
  position:absolute;left:50%;top:18px;transform:translate(-50%,-8px);
  padding:8px 16px;border-radius:10px;font-size:13px;
  background:rgba(12,20,28,.92);border:1px solid #2a3f55;color:#d8e8f7;
  opacity:0;pointer-events:none;transition:opacity .25s,transform .25s;white-space:nowrap;
  box-shadow:0 8px 24px rgba(0,0,0,.5);max-width:90%;overflow:hidden;text-overflow:ellipsis;
}
#toast.show{opacity:1;transform:translate(-50%,0)}

/* ---------- 右侧面板 ---------- */
.panel{width:302px;flex:0 0 302px;display:flex;flex-direction:column;gap:10px}
/* 大屏时右侧面板略宽一些，跟放大的球桌比例更协调 */
@media (min-width:1200px){
  .panel{width:336px;flex:0 0 336px}
}
.card{background:linear-gradient(180deg,#111a25,#0d151e);border:1px solid #1c2a3a;border-radius:14px;padding:12px 14px}

.status-card{display:flex;flex-direction:column;gap:6px}
.status-line{display:flex;align-items:center;gap:8px;font-size:15px;font-weight:600}
.dot{width:9px;height:9px;border-radius:50%;background:#37d08b;box-shadow:0 0 10px rgba(55,208,139,.8);flex:0 0 auto}
.dot.ai{background:#f2a63d;box-shadow:0 0 10px rgba(242,166,61,.8)}
.dot.warn{background:#ef5d5d;box-shadow:0 0 10px rgba(239,93,93,.8)}
.sub{font-size:12px;color:#7e94ab;line-height:1.5}
/* 犯规提示：状态卡里用暖色标出“谁犯规、犯了什么规” */
.sub.warn{color:#f0a85e}

/* 力度条 */
.power-head{display:flex;justify-content:space-between;font-size:12px;color:#8ba1b8;margin-bottom:8px}
.power-track{height:12px;border-radius:8px;background:#0a1119;border:1px solid #1e2c3d;overflow:hidden}
.power-fill{height:100%;width:0%;border-radius:8px;background:linear-gradient(90deg,#2bb673,#e8c33a 55%,#ef5d5d);transition:width .06s linear}

/* 按钮组：flex-wrap 保证小屏自动换行 */
.btn-card{display:flex;flex-wrap:wrap;gap:8px;padding:12px}
.btn{
  flex:1 1 46%;min-width:112px;appearance:none;cursor:pointer;
  font-size:13px;padding:10px 8px;border-radius:10px;
  color:#d7e6f4;background:#16222f;border:1px solid #24374a;
  transition:background .16s,border-color .16s,transform .1s,opacity .16s;
}
.btn:hover{background:#1d2c3c;border-color:#31506b}
.btn:active{transform:scale(.98)}
.btn:disabled{opacity:.4;cursor:not-allowed;transform:none}
.btn.danger{color:#ffb9b9;border-color:#4a2630;background:#221318}
.btn.danger:hover{background:#2c181f;border-color:#6d3441}
.btn.primary{color:#ffffff;background:linear-gradient(180deg,#2f9d6c,#1b6b47);border-color:#2f9d6c}
.btn.primary:hover{background:linear-gradient(180deg,#37b27b,#217a52);border-color:#37b27b}

/* 战绩 */
.rec-head{font-size:12px;color:#8ba1b8;letter-spacing:1px;margin-bottom:10px;display:flex;justify-content:space-between;align-items:center}
.rec-list{display:flex;flex-direction:column;gap:8px;font-size:13px}
.rec-row{display:flex;justify-content:space-between;gap:8px;padding:7px 10px;border-radius:9px;background:#0b1219;border:1px solid #18242f}
.rec-row .k{color:#9db1c6}
.rec-row .v{color:#e8f2fb;font-variant-numeric:tabular-nums;font-weight:600}
.rec-row .v em{font-style:normal;color:#37d08b}

/* ---------- 弹窗 ---------- */
.modal{
  position:fixed;inset:0;z-index:99;display:none;align-items:center;justify-content:center;
  padding:20px;background:rgba(4,7,11,.72);backdrop-filter:blur(4px);
}
.modal.show{display:flex}
.modal-box{
  width:min(420px,100%);border-radius:18px;padding:22px;
  background:linear-gradient(180deg,#152130,#0d151e);
  border:1px solid #27384b;box-shadow:0 30px 80px rgba(0,0,0,.65);
  animation:pop .22s ease-out;
}
@keyframes pop{from{transform:translateY(10px) scale(.97);opacity:0}to{transform:none;opacity:1}}
.modal-box h2{margin:0 0 8px;font-size:19px}
.modal-box p{margin:0 0 18px;font-size:13px;line-height:1.7;color:#93a9bf}
.modal-actions{display:flex;gap:10px;flex-wrap:wrap}
.modal-actions .btn{flex:1 1 40%;min-width:110px}

/* ---------- 响应式 ---------- */
@media (max-width:940px){
  body{padding:10px}
  .main{flex-direction:column}
  .panel{width:100%;flex:1 1 auto}
  .canvas-wrap{padding:6px}
  .btn-card{flex-wrap:wrap}
  .btn{flex:1 1 45%}
}
@media (max-width:560px){
  .brand h1{font-size:17px}
  .seg button{padding:6px 11px;font-size:12px}
  .btn{flex:1 1 100%;min-width:0}
  .status-line{font-size:14px}
  .rec-list{font-size:12px}
}
@media (max-height:520px) and (orientation:landscape){
  .main{flex-direction:row}
  .panel{width:260px;flex:0 0 260px}
}
</style>
</head>
<body>
<div class="app">

  <header>
    <div class="brand">
      <h1>美式八球</h1>
      <span class="tag">CANVAS POOL</span>
    </div>
    <div class="controls">
      <div class="seg" id="modeSeg">
        <button type="button" class="active" data-mode="pvp">本地双人</button>
        <button type="button" data-mode="ai">人机对战</button>
      </div>
      <div class="seg" id="levelSeg" hidden>
        <button type="button" data-level="easy">简单</button>
        <button type="button" class="active" data-level="normal">普通</button>
        <button type="button" data-level="hard">困难</button>
      </div>
    </div>
  </header>

  <div class="main">
    <div class="stage">
      <div class="canvas-wrap">
        <canvas id="table"></canvas>
        <div id="toast"></div>
      </div>
    </div>

    <aside class="panel">
      <div class="card status-card">
        <div class="status-line">
          <span class="dot" id="turnDot"></span>
          <span id="statusText">玩家 1 击球</span>
        </div>
        <div class="sub" id="statusSub">向母球反方向拖动瞄准，松手击球</div>
      </div>

      <div class="card">
        <div class="power-head"><span>力度</span><span id="powerVal">0%</span></div>
        <div class="power-track"><div class="power-fill" id="powerFill"></div></div>
      </div>

      <div class="card btn-card">
        <button type="button" class="btn" id="btnRestart">重新开局</button>
        <button type="button" class="btn" id="btnReplay" disabled>上一杆回放</button>
        <button type="button" class="btn" id="btnSound">音效：开</button>
        <button type="button" class="btn danger" id="btnClear">清空战绩</button>
      </div>

      <div class="card">
        <div class="rec-head"><span>本地战绩</span><span id="recHint">localStorage</span></div>
        <div class="rec-list" id="recordsBody"></div>
      </div>
    </aside>
  </div>
</div>

<div class="modal" id="modal">
  <div class="modal-box">
    <h2 id="modalTitle"></h2>
    <p id="modalText"></p>
    <div class="modal-actions" id="modalActions"></div>
  </div>
</div>

<script>
(function () {
  'use strict';

  /* ============================================================
   * 0. 常量与几何定义（逻辑坐标，与屏幕像素无关）
   * ============================================================ */
  const TAU = Math.PI * 2;

  const VIEW_W = 1120;                 // 逻辑画布宽
  const VIEW_H = 620;                  // 逻辑画布高
  const RAIL = 60;                     // 木框宽度（台面外圈）
  const BALL_R = 14;                   // 球半径

  // 台面（可击球区域）
  const TABLE = { x: RAIL, y: RAIL, w: VIEW_W - RAIL * 2, h: VIEW_H - RAIL * 2 };
  const MID_X = TABLE.x + TABLE.w / 2;
  const MID_Y = TABLE.y + TABLE.h / 2;

  const HEAD_X = TABLE.x + TABLE.w * 0.25;   // 开球线（开球区右边界）
  const FOOT_X = TABLE.x + TABLE.w * 0.75;   // 置球点（球堆顶点）

  const POCKET_R = 32;      // 袋口视觉半径
  const CAPTURE_R = 26;     // 落袋判定半径（球心进入该范围才算落袋）
  const RAIL_GAP = 34;      // 库边在袋口处的留空

  // 六个袋口（上左 上中 上右 下左 下中 下右）
  const POCKETS = [
    { x: TABLE.x + 6, y: TABLE.y + 6 },
    { x: MID_X, y: TABLE.y - 4 },
    { x: TABLE.x + TABLE.w - 6, y: TABLE.y + 6 },
    { x: TABLE.x + 6, y: TABLE.y + TABLE.h - 6 },
    { x: MID_X, y: TABLE.y + TABLE.h + 4 },
    { x: TABLE.x + TABLE.w - 6, y: TABLE.y + TABLE.h - 6 }
  ];
  const POCKET_NAMES = ['左上袋', '中上袋', '右上袋', '左下袋', '中下袋', '右下袋'];

  // 六段库边（线段形式），袋口处断开，球撞到线段端点会产生“袋角回弹”
  const RAIL_SEGS = [
    { x1: TABLE.x + RAIL_GAP, y1: TABLE.y, x2: MID_X - RAIL_GAP, y2: TABLE.y },
    { x1: MID_X + RAIL_GAP, y1: TABLE.y, x2: TABLE.x + TABLE.w - RAIL_GAP, y2: TABLE.y },
    { x1: TABLE.x + RAIL_GAP, y1: TABLE.y + TABLE.h, x2: MID_X - RAIL_GAP, y2: TABLE.y + TABLE.h },
    { x1: MID_X + RAIL_GAP, y1: TABLE.y + TABLE.h, x2: TABLE.x + TABLE.w - RAIL_GAP, y2: TABLE.y + TABLE.h },
    { x1: TABLE.x, y1: TABLE.y + RAIL_GAP, x2: TABLE.x, y2: TABLE.y + TABLE.h - RAIL_GAP },
    { x1: TABLE.x + TABLE.w, y1: TABLE.y + RAIL_GAP, x2: TABLE.x + TABLE.w, y2: TABLE.y + TABLE.h - RAIL_GAP }
  ];

  const PHYS_DT = 1 / 240;      // 物理固定步长（防穿透）
  const MAX_SPEED = 1250;       // 满力度球速（逻辑单位/秒）
  const MIN_SHOT_SPEED = 150;   // 最小出杆速度
  const ROLL_DECEL = 200;       // 滚动摩擦减速度
  const STOP_SPEED = 7;         // 低于该速度视为静止
  const CUSHION_RESTI = 0.84;   // 库边弹性
  const BALL_RESTI = 0.96;      // 球球弹性
  const MAX_DRAG = 250;         // 拖拽多远算满力度

  // 1-7 纯色 / 9-15 花色（与 1-7 同色系）
  const BALL_COLORS = {
    1: '#f2c53d', 2: '#2f6dd0', 3: '#d64545', 4: '#7b4bc4',
    5: '#e8853a', 6: '#2f9e57', 7: '#8f2233', 8: '#1b1b1b',
    9: '#f2c53d', 10: '#2f6dd0', 11: '#d64545', 12: '#7b4bc4',
    13: '#e8853a', 14: '#2f9e57', 15: '#8f2233'
  };

  /* ============================================================
   * 1. 通用工具函数
   * ============================================================ */
  const clamp = (v, a, b) => (v < a ? a : v > b ? b : v);
  const dist = (ax, ay, bx, by) => Math.hypot(ax - bx, ay - by);

  function roundRect(ctx, x, y, w, h, r) {
    ctx.beginPath();
    ctx.moveTo(x + r, y);
    ctx.arcTo(x + w, y, x + w, y + h, r);
    ctx.arcTo(x + w, y + h, x, y + h, r);
    ctx.arcTo(x, y + h, x, y, r);
    ctx.arcTo(x, y, x + w, y, r);
    ctx.closePath();
  }

  // 颜色明暗调整（用于球的立体渐变）
  function shade(hex, k) {
    const n = parseInt(hex.slice(1), 16);
    let r = (n >> 16) & 255, g = (n >> 8) & 255, b = n & 255;
    if (k > 0) { r += (255 - r) * k; g += (255 - g) * k; b += (255 - b) * k; }
    else { r *= 1 + k; g *= 1 + k; b *= 1 + k; }
    return `rgb(${r | 0},${g | 0},${b | 0})`;
  }

  /* ============================================================
   * 2. 游戏状态
   * ============================================================ */
  const state = {
    mode: 'pvp',            // 'pvp' 本地双人 | 'ai' 人机对战
    aiLevel: 'normal',      // 'easy' | 'normal' | 'hard'
    balls: [],              // 16 颗球
    turn: 0,                // 当前击球方：0 玩家1 / 1 玩家2(或AI)
    groups: [null, null],   // 球组：'solid' 纯色 | 'stripe' 花色
    phase: 'aim',           // aim | shooting | ballInHand | groupChoice | replay | gameover
    locked: false,          // 锁定输入（AI 回合、动画中）
    power: 0,               // 当前力度 0~1
    aimDir: { x: 1, y: 0 }, // 瞄准方向（单位向量）
    aiming: false,          // 是否正在拖拽瞄准
    settleTimer: 0,         // 停球后的结算延时
    dragMode: null,         // 'aim' | 'place'
    calledPocket: -1,       // 黑八阶段指定的袋口
    ballInHand: false,      // 手中球状态
    breakDone: false,       // 开球是否已完成
    shot: null,             // 当前一杆的统计
    downPos: null,          // 按下位置
    moved: false,           // 本次按下是否发生拖动
    placeOrigin: null,      // 手中球拖动前的原位置
    modalOpen: false,
    gameOver: false,
    winner: null,
    replayFrames: null,   // 当前一杆的回放帧
    lastFoul: null        // 最近一次犯规的文字（谁犯规 + 原因），下一杆开始时清空
  };

  /* ============================================================
   * 3. 球与球堆
   * ============================================================ */
  function makeBall(id, x, y) {
    let kind;
    if (id === 0) kind = 'cue';
    else if (id === 8) kind = 'eight';
    else if (id < 8) kind = 'solid';
    else kind = 'stripe';
    return {
      id, kind,
      x, y, vx: 0, vy: 0,
      active: true,
      color: id === 0 ? '#f7f4ec' : BALL_COLORS[id]
    };
  }

  // 生成 1-15 号球的摆球顺序（8 号固定在第三排中间，底排两角一纯一花）
  function rackOrder() {
    const solids = [1, 2, 3, 4, 5, 6, 7];
    const stripes = [9, 10, 11, 12, 13, 14, 15];
    const shuffle = arr => arr.sort(() => Math.random() - 0.5);

    const s = shuffle(solids.slice());
    const t = shuffle(stripes.slice());
    const order = new Array(15).fill(0);

    // 三角堆位置索引：row0[0] / row1[0..1] / row2[0..2] / row3[0..3] / row4[0..4]
    // 8 号固定在第 3 排（row2）中间 = 索引 4
    order[4] = 8;
    // 底排两角：一纯色一花色
    order[10] = s.pop();     // row4 左角
    order[14] = t.pop();     // row4 右角
    // 其余位置交替填充
    const rest = [0, 1, 2, 3, 5, 6, 7, 8, 9, 11, 12, 13];
    let flip = Math.random() < 0.5;
    for (const idx of rest) {
      const pool = flip ? (s.length ? s : t) : (t.length ? t : s);
      order[idx] = pool.pop();
      flip = !flip;
    }
    return order;
  }

  // 重置全部球的位置（开球摆位）
  function setupBalls() {
    const balls = [];
    // 母球放在开球区内（开球线左侧）
    balls.push(makeBall(0, HEAD_X - 60, MID_Y));

    const order = rackOrder();
    const dx = BALL_R * 2 * Math.cos(Math.PI / 6) + 0.6;   // 相邻两排的水平间距
    const dy = BALL_R * 2 + 0.6;                            // 同排球的垂直间距
    const slots = [];   // [x, y]
    let k = 0;
    for (let row = 0; row < 5; row++) {
      for (let j = 0; j <= row; j++) {
        const x = FOOT_X + row * dx;
        const y = MID_Y + (j - row / 2) * dy;
        slots.push([x, y]);
      }
    }
    for (let i = 0; i < 15; i++) {
      const [x, y] = slots[i];
      balls.push(makeBall(order[i], x, y));
    }
    state.balls = balls;
  }

  /* ============================================================
   * 4. Canvas 初始化与自适应缩放
   * ============================================================ */
  const canvas = document.getElementById('table');
  const ctx = canvas.getContext('2d');

  // 按设备像素比放大位图，保证高分屏清晰；CSS 用 100% 宽 + auto 高，等比不变形
  function resizeCanvas() {
    const dpr = Math.min(window.devicePixelRatio || 1, 2);
    canvas.width = Math.round(VIEW_W * dpr);
    canvas.height = Math.round(VIEW_H * dpr);
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  }
  window.addEventListener('resize', resizeCanvas);
  window.addEventListener('orientationchange', resizeCanvas);

  /* ============================================================
   * 5. 渲染
   * ============================================================ */
  function drawFrame() {
    // 木质外框
    ctx.save();
    roundRect(ctx, 2, 2, VIEW_W - 4, VIEW_H - 4, 26);
    const g = ctx.createLinearGradient(0, 0, 0, VIEW_H);
    g.addColorStop(0, '#8a5a36');
    g.addColorStop(0.35, '#6d4128');
    g.addColorStop(0.72, '#542f1c');
    g.addColorStop(1, '#38200f');
    ctx.fillStyle = g;
    ctx.fill();

    // 外圈高光 + 内圈暗边
    ctx.lineWidth = 2;
    ctx.strokeStyle = 'rgba(255,224,190,.22)';
    ctx.stroke();

    roundRect(ctx, 16, 16, VIEW_W - 32, VIEW_H - 32, 18);
    ctx.lineWidth = 10;
    ctx.strokeStyle = 'rgba(0,0,0,.28)';
    ctx.stroke();
    ctx.restore();
  }

  function drawCloth() {
    ctx.save();
    // 台呢底色（中心亮、四周暗）
    const rg = ctx.createRadialGradient(MID_X, MID_Y, 60, MID_X, MID_Y, 660);
    rg.addColorStop(0, '#1b8f60');
    rg.addColorStop(0.55, '#0f7350');
    rg.addColorStop(1, '#08492f');
    ctx.fillStyle = rg;
    ctx.fillRect(TABLE.x, TABLE.y, TABLE.w, TABLE.h);

    // 台面内侧阴影，强化凹陷感
    const sh = ctx.createLinearGradient(0, TABLE.y, 0, TABLE.y + 26);
    sh.addColorStop(0, 'rgba(0,0,0,.35)');
    sh.addColorStop(1, 'rgba(0,0,0,0)');
    ctx.fillStyle = sh;
    ctx.fillRect(TABLE.x, TABLE.y, TABLE.w, 26);
    const sh2 = ctx.createLinearGradient(0, TABLE.y + TABLE.h, 0, TABLE.y + TABLE.h - 26);
    sh2.addColorStop(0, 'rgba(0,0,0,.35)');
    sh2.addColorStop(1, 'rgba(0,0,0,0)');
    ctx.fillStyle = sh2;
    ctx.fillRect(TABLE.x, TABLE.y + TABLE.h - 26, TABLE.w, 26);
    const sh3 = ctx.createLinearGradient(TABLE.x, 0, TABLE.x + 26, 0);
    sh3.addColorStop(0, 'rgba(0,0,0,.3)');
    sh3.addColorStop(1, 'rgba(0,0,0,0)');
    ctx.fillStyle = sh3;
    ctx.fillRect(TABLE.x, TABLE.y, 26, TABLE.h);
    const sh4 = ctx.createLinearGradient(TABLE.x + TABLE.w, 0, TABLE.x + TABLE.w - 26, 0);
    sh4.addColorStop(0, 'rgba(0,0,0,.3)');
    sh4.addColorStop(1, 'rgba(0,0,0,0)');
    ctx.fillStyle = sh4;
    ctx.fillRect(TABLE.x + TABLE.w - 26, TABLE.y, 26, TABLE.h);

    // 开球线（虚线，仅做位置提示）
    ctx.save();
    ctx.strokeStyle = 'rgba(255,255,255,.14)';
    ctx.lineWidth = 1.5;
    ctx.setLineDash([9, 9]);
    ctx.beginPath();
    ctx.moveTo(HEAD_X, TABLE.y + 4);
    ctx.lineTo(HEAD_X, TABLE.y + TABLE.h - 4);
    ctx.stroke();
    ctx.restore();

    // 置球点 & 开球点
    ctx.fillStyle = 'rgba(255,255,255,.18)';
    ctx.beginPath(); ctx.arc(FOOT_X, MID_Y, 2.4, 0, TAU); ctx.fill();
    ctx.beginPath(); ctx.arc(HEAD_X + 30, MID_Y, 2.4, 0, TAU); ctx.fill();
    ctx.restore();
  }

  // 绘制一段库边（在台面边缘外侧铺一层梯形胶条，端点斜切形成袋角）
  function drawCushion(x1, y1, x2, y2, nx, ny) {
    const thick = 17, cut = 9;
    const dx = x2 - x1, dy = y2 - y1;
    const l = Math.hypot(dx, dy) || 1;
    const ux = dx / l, uy = dy / l;

    ctx.beginPath();
    ctx.moveTo(x1, y1);
    ctx.lineTo(x2, y2);
    ctx.lineTo(x2 + nx * thick - ux * cut, y2 + ny * thick - uy * cut);
    ctx.lineTo(x1 + nx * thick + ux * cut, y1 + ny * thick + uy * cut);
    ctx.closePath();

    const g = ctx.createLinearGradient(
      x1 + nx * thick, y1 + ny * thick,
      x1, y1
    );
    g.addColorStop(0, '#0a4f34');
    g.addColorStop(0.7, '#0e6b48');
    g.addColorStop(1, '#15916a');
    ctx.fillStyle = g;
    ctx.fill();

    // 靠近台面的高光条
    ctx.strokeStyle = 'rgba(255,255,255,.13)';
    ctx.lineWidth = 2;
    ctx.beginPath();
    ctx.moveTo(x1, y1);
    ctx.lineTo(x2, y2);
    ctx.stroke();
  }

  function drawCushions() {
    ctx.save();
    drawCushion(TABLE.x + RAIL_GAP, TABLE.y, MID_X - RAIL_GAP, TABLE.y, 0, -1);          // 上-left
    drawCushion(MID_X + RAIL_GAP, TABLE.y, TABLE.x + TABLE.w - RAIL_GAP, TABLE.y, 0, -1); // 上-right
    drawCushion(TABLE.x + RAIL_GAP, TABLE.y + TABLE.h, MID_X - RAIL_GAP, TABLE.y + TABLE.h, 0, 1);
    drawCushion(MID_X + RAIL_GAP, TABLE.y + TABLE.h, TABLE.x + TABLE.w - RAIL_GAP, TABLE.y + TABLE.h, 0, 1);
    drawCushion(TABLE.x, TABLE.y + RAIL_GAP, TABLE.x, TABLE.y + TABLE.h - RAIL_GAP, -1, 0);
    drawCushion(TABLE.x + TABLE.w, TABLE.y + RAIL_GAP, TABLE.x + TABLE.w, TABLE.y + TABLE.h - RAIL_GAP, 1, 0);
    ctx.restore();
  }

  function drawPockets() {
    for (let i = 0; i < POCKETS.length; i++) {
      const p = POCKETS[i];
      // 袋口外圈木纹
      ctx.beginPath();
      ctx.arc(p.x, p.y, POCKET_R + 7, 0, TAU);
      ctx.fillStyle = 'rgba(20,10,4,.45)';
      ctx.fill();

      // 袋洞
      const rg = ctx.createRadialGradient(p.x - 6, p.y - 6, 2, p.x, p.y, POCKET_R);
      rg.addColorStop(0, '#000');
      rg.addColorStop(0.75, '#050809');
      rg.addColorStop(1, '#141a1e');
      ctx.beginPath();
      ctx.arc(p.x, p.y, POCKET_R, 0, TAU);
      ctx.fillStyle = rg;
      ctx.fill();

      ctx.beginPath();
      ctx.arc(p.x, p.y, POCKET_R - 1, 0, TAU);
      ctx.strokeStyle = 'rgba(255,255,255,.10)';
      ctx.lineWidth = 1.5;
      ctx.stroke();
    }
  }

  // 手中球：高亮开球区，提示可摆放范围
  function drawBallInHandArea() {
    if (!state.ballInHand) return;
    ctx.save();
    ctx.fillStyle = 'rgba(120,220,180,.08)';
    ctx.fillRect(TABLE.x, TABLE.y, HEAD_X - TABLE.x, TABLE.h);
    ctx.setLineDash([7, 7]);
    ctx.lineWidth = 1.5;
    ctx.strokeStyle = 'rgba(140,235,195,.42)';
    ctx.strokeRect(TABLE.x + 1, TABLE.y + 1, HEAD_X - TABLE.x - 2, TABLE.h - 2);
    ctx.restore();

    // 母球周围的脉冲圈，提示“可拖动”
    const cue = cueBall();
    if (cue && cue.active) {
      const t = (performance.now() / 900) % 1;
      ctx.beginPath();
      ctx.arc(cue.x, cue.y, BALL_R + 6 + t * 10, 0, TAU);
      ctx.strokeStyle = `rgba(140,235,195,${0.5 * (1 - t)})`;
      ctx.lineWidth = 2;
      ctx.stroke();
    }
  }

  // 黑八阶段：提示可选袋口，高亮已指定袋口
  function drawPocketHint() {
    if (state.phase !== 'aim') return;
    if (!isOnEight(state.turn)) return;
    ctx.save();
    POCKETS.forEach((p, i) => {
      const called = i === state.calledPocket;
      ctx.beginPath();
      ctx.arc(p.x, p.y, POCKET_R - 4, 0, TAU);
      ctx.setLineDash(called ? [] : [6, 6]);
      ctx.lineWidth = called ? 3 : 1.5;
      ctx.strokeStyle = called ? 'rgba(255,208,90,.95)' : 'rgba(255,255,255,.30)';
      ctx.stroke();
    });
    ctx.restore();
  }

  // 单颗球
  function drawBall(b, x, y) {
    const r = BALL_R;

    // 投影
    ctx.beginPath();
    ctx.ellipse(x + 2.5, y + 3.5, r * 0.98, r * 0.86, 0, 0, TAU);
    ctx.fillStyle = 'rgba(0,0,0,.32)';
    ctx.fill();

    if (b.kind === 'stripe') {
      // 花色球：白底 + 中间色带
      ctx.beginPath();
      ctx.arc(x, y, r, 0, TAU);
      ctx.fillStyle = '#f6f2e7';
      ctx.fill();

      ctx.save();
      ctx.beginPath();
      ctx.arc(x, y, r, 0, TAU);
      ctx.clip();
      ctx.fillStyle = b.color;
      ctx.fillRect(x - r, y - r * 0.56, r * 2, r * 1.12);
      // 色带上下描边，模拟条纹边界
      ctx.strokeStyle = 'rgba(0,0,0,.18)';
      ctx.lineWidth = 1;
      ctx.beginPath();
      ctx.moveTo(x - r, y - r * 0.56);
      ctx.lineTo(x + r, y - r * 0.56);
      ctx.moveTo(x - r, y + r * 0.56);
      ctx.lineTo(x + r, y + r * 0.56);
      ctx.stroke();
      ctx.restore();

      // 边缘球面渐变
      const sheen = ctx.createRadialGradient(x - r * 0.35, y - r * 0.4, r * 0.1, x, y, r);
      sheen.addColorStop(0, 'rgba(255,255,255,.28)');
      sheen.addColorStop(0.6, 'rgba(255,255,255,0)');
      sheen.addColorStop(1, 'rgba(0,0,0,.35)');
      ctx.beginPath();
      ctx.arc(x, y, r, 0, TAU);
      ctx.fillStyle = sheen;
      ctx.fill();
    } else {
      // 纯色球 / 黑八 / 母球：径向渐变
      const base = b.color;
      const grad = ctx.createRadialGradient(
        x - r * 0.36, y - r * 0.42, r * 0.12,
        x, y, r * 1.02
      );
      grad.addColorStop(0, shade(base, 0.5));
      grad.addColorStop(0.55, base);
      grad.addColorStop(1, shade(base, -0.42));
      ctx.beginPath();
      ctx.arc(x, y, r, 0, TAU);
      ctx.fillStyle = grad;
      ctx.fill();
    }

    // 号码圈
    if (b.kind !== 'cue') {
      ctx.beginPath();
      ctx.arc(x, y, r * 0.44, 0, TAU);
      ctx.fillStyle = '#fbfaf6';
      ctx.fill();
      ctx.fillStyle = '#151a1f';
      ctx.font = `bold ${Math.round(r * 0.56)}px -apple-system,"PingFang SC","Microsoft YaHei",sans-serif`;
      ctx.textAlign = 'center';
      ctx.textBaseline = 'middle';
      ctx.fillText(String(b.id), x, y + r * 0.02);
    }

    // 高光
    ctx.beginPath();
    ctx.arc(x - r * 0.33, y - r * 0.38, r * 0.22, 0, TAU);
    ctx.fillStyle = 'rgba(255,255,255,.55)';
    ctx.fill();
  }

  function drawBalls() {
    // 回放：按记录的帧绘制球位
    if (state.phase === 'replay' && replayData) {
      const frames = replayData.frames;
      const f = frames[Math.min(frames.length - 1, Math.floor(replayIdx))];
      for (let i = 0; i < state.balls.length; i++) {
        const d = f && f[i];
        if (!d || !d[2]) continue;
        drawBall(state.balls[i], d[0], d[1]);
      }
      return;
    }
    for (const b of state.balls) {
      if (!b.active) continue;
      drawBall(b, b.x, b.y);
    }
  }

  // 主渲染入口：snapshot 不为空时用回放帧数据（阶段 5 使用）
  function render() {
    ctx.clearRect(0, 0, VIEW_W, VIEW_H);
    drawFrame();
    drawCloth();
    drawCushions();
    drawPockets();
    drawBallInHandArea();
    drawPocketHint();
    drawBalls();
    drawAim();
    drawCueStick();
  }

  /* ============================================================
   * 6. 物理引擎：运动、球球碰撞、库边反弹、落袋判定
   * ============================================================ */

  // 音效钩子（第 6 阶段注入真实实现，这里先留空避免耦合）
  let sfxCue = function () {};
  let sfxHit = function () {};
  let sfxPocket = function () {};

  const cueBall = () => state.balls[0];

  function allStopped() {
    for (const b of state.balls) {
      if (b.active && (b.vx !== 0 || b.vy !== 0)) return false;
    }
    return true;
  }

  // 一个物理子步：摩擦 → 位移 → 球球碰撞 → 库边 → 袋口
  function substep(dt) {
    const balls = state.balls;

    for (const b of balls) {
      if (!b.active) continue;
      const sp = Math.hypot(b.vx, b.vy);
      if (sp === 0) continue;
      const ns = sp - ROLL_DECEL * dt;
      if (ns <= STOP_SPEED) {
        b.vx = 0;
        b.vy = 0;
      } else {
        const k = ns / sp;
        b.vx *= k;
        b.vy *= k;
        b.x += b.vx * dt;
        b.y += b.vy * dt;
      }
    }

    for (let i = 0; i < balls.length; i++) {
      const a = balls[i];
      if (!a.active) continue;
      for (let j = i + 1; j < balls.length; j++) {
        const b = balls[j];
        if (b.active) collideBalls(a, b);
      }
    }

    for (const b of balls) {
      if (b.active) collideRails(b);
    }

    for (const b of balls) {
      if (b.active) checkPocket(b);
    }
  }

  // 等质量弹性碰撞
  function collideBalls(a, b) {
    const dx = b.x - a.x;
    const dy = b.y - a.y;
    const d2 = dx * dx + dy * dy;
    const minD = BALL_R * 2;
    if (d2 >= minD * minD || d2 < 1e-6) return;

    const d = Math.sqrt(d2);
    const nx = dx / d;
    const ny = dy / d;

    // 先分离重叠，避免粘连
    const overlap = minD - d;
    a.x -= nx * overlap * 0.5;
    a.y -= ny * overlap * 0.5;
    b.x += nx * overlap * 0.5;
    b.y += ny * overlap * 0.5;

    // 记录母球第一次碰到的球（规则判定用）
    if (state.shot && state.shot.firstHit === null && (a.id === 0 || b.id === 0)) {
      state.shot.firstHit = a.id === 0 ? b.id : a.id;
    }

    const rvn = (b.vx - a.vx) * nx + (b.vy - a.vy) * ny;
    if (rvn > 0) return; // 正在分离，不再施加冲量

    const imp = -(1 + BALL_RESTI) * rvn * 0.5;
    a.vx -= imp * nx;
    a.vy -= imp * ny;
    b.vx += imp * nx;
    b.vy += imp * ny;

    sfxHit(Math.min(1, Math.abs(rvn) / 600));
  }

  // 球与库边线段碰撞（线段端点天然形成“袋角”，擦袋可弹回）
  function collideRails(b) {
    for (const s of RAIL_SEGS) {
      const dx = s.x2 - s.x1;
      const dy = s.y2 - s.y1;
      const segLen2 = dx * dx + dy * dy;
      const t = clamp(((b.x - s.x1) * dx + (b.y - s.y1) * dy) / segLen2, 0, 1);
      const px = s.x1 + dx * t;
      const py = s.y1 + dy * t;

      const ox = b.x - px;
      const oy = b.y - py;
      const d = Math.hypot(ox, oy);
      if (d >= BALL_R || d < 1e-6) continue;

      const nx = ox / d;
      const ny = oy / d;
      b.x = px + nx * BALL_R;
      b.y = py + ny * BALL_R;

      const vn = b.vx * nx + b.vy * ny;
      if (vn < 0) {
        b.vx -= (1 + CUSHION_RESTI) * vn * nx;
        b.vy -= (1 + CUSHION_RESTI) * vn * ny;
        sfxHit(Math.min(0.6, Math.abs(vn) / 900));
      }
    }
  }

  function checkPocket(b) {
    for (let i = 0; i < POCKETS.length; i++) {
      const p = POCKETS[i];
      if (dist(b.x, b.y, p.x, p.y) < CAPTURE_R) {
        pocketBall(b, i);
        return;
      }
    }
    // 兜底：极端情况下穿出边界，按最近袋口处理
    if (b.x < TABLE.x - 34 || b.x > TABLE.x + TABLE.w + 34 ||
        b.y < TABLE.y - 34 || b.y > TABLE.y + TABLE.h + 34) {
      let best = 0;
      let bd = Infinity;
      for (let i = 0; i < POCKETS.length; i++) {
        const d = dist(b.x, b.y, POCKETS[i].x, POCKETS[i].y);
        if (d < bd) { bd = d; best = i; }
      }
      pocketBall(b, best);
    }
  }

  function pocketBall(b, pocketIdx) {
    b.active = false;
    b.vx = 0;
    b.vy = 0;
    sfxPocket(b.id === 0);
    if (!state.shot) return;
    if (b.id === 0) {
      state.shot.cuePotted = true;
    } else if (b.id === 8) {
      state.shot.eightPocket = pocketIdx;
    }
    state.shot.potted.push({ id: b.id, pocket: pocketIdx });
  }

  // 固定步长推进物理
  let physAcc = 0;
  function stepPhysics(dt) {
    physAcc += dt;
    let guard = 0;
    while (physAcc >= PHYS_DT && guard < 80) {
      substep(PHYS_DT);
      physAcc -= PHYS_DT;
      guard++;
    }
    if (guard >= 80) physAcc = 0;
  }

  /* ============================================================
   * 7. 瞄准辅助线（只预测母球出发方向，不做碰撞后轨迹预测）
   * ============================================================ */
  function raycastAim(from, dir, maxDist) {
    let best = maxDist;

    // 与其它球相交
    for (const b of state.balls) {
      if (!b.active || b.id === 0) continue;
      const fx = b.x - from.x;
      const fy = b.y - from.y;
      const t = fx * dir.x + fy * dir.y;
      if (t <= 0) continue;
      const perp2 = fx * fx + fy * fy - t * t;
      const rr = (BALL_R * 2) * (BALL_R * 2);
      if (perp2 >= rr) continue;
      const hit = t - Math.sqrt(rr - perp2);
      if (hit > 0 && hit < best) best = hit;
    }

    // 与台面边界相交
    const x1 = TABLE.x + BALL_R;
    const x2 = TABLE.x + TABLE.w - BALL_R;
    const y1 = TABLE.y + BALL_R;
    const y2 = TABLE.y + TABLE.h - BALL_R;
    if (dir.x > 0) best = Math.min(best, (x2 - from.x) / dir.x);
    if (dir.x < 0) best = Math.min(best, (x1 - from.x) / dir.x);
    if (dir.y > 0) best = Math.min(best, (y2 - from.y) / dir.y);
    if (dir.y < 0) best = Math.min(best, (y1 - from.y) / dir.y);

    return Math.max(0, best);
  }

  function drawAim() {
    if (state.phase !== 'aim' || state.modalOpen) return;
    const cue = cueBall();
    if (!cue || !cue.active) return;

    ctx.save();
    ctx.globalAlpha = state.aiming ? 1 : 0.5;

    const dir = state.aimDir;
    const len = raycastAim(cue, dir, 1400);
    const ex = cue.x + dir.x * len;
    const ey = cue.y + dir.y * len;

    // 虚线
    ctx.save();
    ctx.setLineDash([9, 7]);
    ctx.lineWidth = 2;
    ctx.strokeStyle = 'rgba(255,255,255,.62)';
    ctx.beginPath();
    ctx.moveTo(cue.x + dir.x * (BALL_R + 2), cue.y + dir.y * (BALL_R + 2));
    ctx.lineTo(ex, ey);
    ctx.stroke();
    ctx.restore();

    // 起点光点
    const rg = ctx.createRadialGradient(cue.x, cue.y, 2, cue.x, cue.y, BALL_R * 2.4);
    rg.addColorStop(0, 'rgba(255,255,255,.42)');
    rg.addColorStop(1, 'rgba(255,255,255,0)');
    ctx.fillStyle = rg;
    ctx.beginPath();
    ctx.arc(cue.x, cue.y, BALL_R * 2.4, 0, TAU);
    ctx.fill();

    // 终点小箭头
    ctx.save();
    ctx.translate(ex, ey);
    ctx.rotate(Math.atan2(dir.y, dir.x));
    ctx.fillStyle = 'rgba(255,255,255,.5)';
    ctx.beginPath();
    ctx.moveTo(0, 0);
    ctx.lineTo(-8, -4);
    ctx.lineTo(-8, 4);
    ctx.closePath();
    ctx.fill();
    ctx.restore();

    ctx.restore();
  }

  // 出杆时的球杆（画在拖拽方向一侧，即母球反方向）
  function drawCueStick() {
    if (!state.aiming) return;
    const cue = cueBall();
    if (!cue || !cue.active) return;

    const dir = state.aimDir;
    const bx = -dir.x;
    const by = -dir.y;
    const pull = 16 + state.power * 46;
    const tipX = cue.x + bx * (BALL_R + pull);
    const tipY = cue.y + by * (BALL_R + pull);
    const shaftLen = 150;
    const buttLen = 62;
    const midX = tipX + bx * shaftLen;
    const midY = tipY + by * shaftLen;
    const buttX = midX + bx * buttLen;
    const buttY = midY + by * buttLen;

    // 前节
    ctx.lineWidth = 5;
    ctx.strokeStyle = '#e9d6ae';
    ctx.beginPath();
    ctx.moveTo(tipX, tipY);
    ctx.lineTo(midX, midY);
    ctx.stroke();

    // 后把
    const g = ctx.createLinearGradient(midX, midY, buttX, buttY);
    g.addColorStop(0, '#8b5a32');
    g.addColorStop(0.4, '#5a361d');
    g.addColorStop(1, '#2e1a0c');
    ctx.lineWidth = 11;
    ctx.strokeStyle = g;
    ctx.beginPath();
    ctx.moveTo(midX, midY);
    ctx.lineTo(buttX, buttY);
    ctx.stroke();

    // 皮头
    ctx.beginPath();
    ctx.arc(tipX, tipY, 3.6, 0, TAU);
    ctx.fillStyle = '#2b7ea8';
    ctx.fill();

    // 力度光晕
    if (state.power > 0.02) {
      const pr = 4 + state.power * 10;
      ctx.beginPath();
      ctx.arc(cue.x, cue.y, BALL_R + pr, 0, TAU);
      ctx.strokeStyle = `rgba(255,210,90,${0.18 + state.power * 0.5})`;
      ctx.lineWidth = 2;
      ctx.stroke();
    }
  }

  /* ============================================================
   * 8. 输入：鼠标 / 触摸拖拽瞄准
   * ============================================================ */
  let activePointer = null;

  function pointerPos(e) {
    const rect = canvas.getBoundingClientRect();
    return {
      x: (e.clientX - rect.left) / rect.width * VIEW_W,
      y: (e.clientY - rect.top) / rect.height * VIEW_H
    };
  }

  function canControl() {
    if (state.modalOpen || state.gameOver || state.locked) return false;
    if (state.phase !== 'aim') return false;
    if (state.mode === 'ai' && state.turn === 1) return false; // AI 回合锁定玩家操作
    return true;
  }

  // 命中哪个袋口（轻点袋口用于指定黑八目标袋）
  function pocketAt(x, y) {
    for (let i = 0; i < POCKETS.length; i++) {
      if (dist(x, y, POCKETS[i].x, POCKETS[i].y) < 46) return i;
    }
    return -1;
  }

  // 根据指针位置更新瞄准方向与力度（拖拽方向 = 击球反方向，拖拽距离 = 力度）
  function updateAimFromPointer(p) {
    const cue = cueBall();
    if (!cue || !cue.active) return;
    const dx = cue.x - p.x;
    const dy = cue.y - p.y;
    const d = Math.hypot(dx, dy);
    if (d > 0.5) state.aimDir = { x: dx / d, y: dy / d };

    const pull = Math.max(0, d - BALL_R * 1.6);
    state.power = clamp(pull / MAX_DRAG, 0, 1);
    updatePowerUI();
  }

  function onPointerDown(e) {
    // 首次触控/点击时解锁音频
    Sound.init();
    Sound.resume();
    if (!canControl() || activePointer !== null) return;
    e.preventDefault();
    activePointer = e.pointerId;
    if (canvas.setPointerCapture) canvas.setPointerCapture(e.pointerId);

    const p = pointerPos(e);
    state.downPos = p;
    state.moved = false;

    const cue = cueBall();
    // 手中球状态：按在母球上 → 拖动摆放
    if (state.ballInHand && cue && dist(p.x, p.y, cue.x, cue.y) < 95) {
      state.dragMode = 'place';
      state.aiming = false;
      state.placeOrigin = { x: cue.x, y: cue.y };
      return;
    }

    state.dragMode = 'aim';
    state.aiming = true;
    updateAimFromPointer(p);
  }

  function onPointerMove(e) {
    if (e.pointerId !== activePointer) return;
    e.preventDefault();
    const p = pointerPos(e);

    if (state.downPos && dist(p.x, p.y, state.downPos.x, state.downPos.y) > 6) {
      state.moved = true;
    }

    if (state.dragMode === 'place') {
      const cue = cueBall();
      if (!cue) return;
      const maxX = state.ballInHand ? HEAD_X : TABLE.x + TABLE.w - BALL_R;
      const tx = clamp(p.x, TABLE.x + BALL_R, maxX);
      const ty = clamp(p.y, TABLE.y + BALL_R, TABLE.y + TABLE.h - BALL_R);
      if (cueFits(tx, ty)) {
        cue.x = tx;
        cue.y = ty;
      }
      return;
    }

    if (state.aiming) updateAimFromPointer(p);
  }

  function onPointerUp(e) {
    if (e.pointerId !== activePointer) return;
    activePointer = null;

    const wasPlace = state.dragMode === 'place';
    state.dragMode = null;

    // 摆放结束：落点不合法则回到原位，之后仍可继续拖拽瞄准
    if (wasPlace) {
      const cue = cueBall();
      if (cue && !cueFits(cue.x, cue.y) && state.placeOrigin) {
        cue.x = state.placeOrigin.x;
        cue.y = state.placeOrigin.y;
      }
      state.power = 0;
      updatePowerUI();
      updateStatus();
      return;
    }

    if (!state.aiming) return;
    state.aiming = false;

    const p = pointerPos(e);

    // 轻点袋口 → 指定黑八目标袋
    if (!state.moved && isOnEight(state.turn)) {
      const idx = pocketAt(p.x, p.y);
      if (idx >= 0) {
        state.calledPocket = idx;
        state.power = 0;
        updatePowerUI();
        updateStatus();
        toast('已指定目标袋：' + POCKET_NAMES[idx]);
        return;
      }
    }

    const power = state.power;
    if (power > 0.04) {
      shoot(power);
    } else {
      state.power = 0;
      updatePowerUI();
    }
  }

  canvas.addEventListener('pointerdown', onPointerDown, { passive: false });
  canvas.addEventListener('pointermove', onPointerMove, { passive: false });
  canvas.addEventListener('pointerup', onPointerUp);
  canvas.addEventListener('pointercancel', onPointerUp);
  canvas.addEventListener('contextmenu', e => e.preventDefault());

  /* ============================================================
   * 9. 击球流程与美式八球规则
   * ============================================================ */
  function shoot(power) {
    const cue = cueBall();
    if (!cue || !cue.active) return;

    // 黑八阶段必须指定袋口
    if (isOnEight(state.turn) && state.calledPocket < 0) {
      toast('黑八阶段请先点击袋口指定目标袋');
      state.power = 0;
      updatePowerUI();
      return;
    }

    const speed = Math.max(MIN_SHOT_SPEED, MAX_SPEED * power);
    cue.vx = state.aimDir.x * speed;
    cue.vy = state.aimDir.y * speed;

    state.shot = {
      firstHit: null,
      potted: [],
      cuePotted: false,
      eightPocket: null,
      preRemaining: state.groups[state.turn] ? remainingOf(state.turn) : 99,
      targetKind: targetKind(state.turn),
      isBreak: !state.breakDone
    };
    state.phase = 'shooting';
    state.aiming = false;
    state.ballInHand = false;
    state.lastFoul = null;      // 新的一杆开始，上一次犯规提示作废
    state.power = 0;
    state.settleTimer = 0;
    startRecording();
    el('btnReplay').disabled = true;
    updatePowerUI();
    updateStatus();
    sfxCue(power);
  }

  /* ---------- 球组 / 目标球相关 ---------- */
  function ballKind(id) {
    if (id === 8) return 'eight';
    return id < 8 ? 'solid' : 'stripe';
  }

  function remainingOf(player) {
    const g = state.groups[player];
    if (!g) return 99;
    let n = 0;
    for (const b of state.balls) {
      if (b.active && b.id !== 0 && ballKind(b.id) === g) n++;
    }
    return n;
  }

  function isOnEight(player) {
    return !!state.groups[player] && remainingOf(player) === 0;
  }

  function targetKind(player) {
    if (!state.groups[player]) return 'open';
    return remainingOf(player) === 0 ? 'eight' : state.groups[player];
  }

  function assignGroups(player, kind) {
    state.groups[player] = kind;
    state.groups[1 - player] = kind === 'solid' ? 'stripe' : 'solid';
  }

  function nameOf(player) {
    if (player === 1 && state.mode === 'ai') return '电脑';
    return player === 0 ? '玩家 1' : '玩家 2';
  }

  /* ---------- 结算一杆 ---------- */
  function endShot() {
    const me = state.turn;
    const opp = 1 - me;
    const shot = state.shot;

    state.shot = null;
    state.settleTimer = 0;
    state.phase = 'aim';
    state.breakDone = true;
    state.locked = false;
    finishRecording();

    if (!shot) { updateStatus(); return; }

    // ---------- 1) 黑八结算（优先处理胜负） ----------
    if (shot.eightPocket !== null) {
      const called = state.calledPocket;
      let loseReason = null;
      if (shot.preRemaining > 0) {
        loseReason = '还没清完自己的球就打进黑八';
      } else if (shot.cuePotted) {
        loseReason = '打进黑八的同时母球落袋';
      } else if (called >= 0 && shot.eightPocket !== called) {
        loseReason = `黑八打进了${POCKET_NAMES[shot.eightPocket]}，而不是指定的${POCKET_NAMES[called]}`;
      }

      if (loseReason) {
        endGame(opp, `${nameOf(me)} ${loseReason}，${nameOf(opp)} 获胜。`);
      } else {
        endGame(me, `${nameOf(me)} 成功打进黑八，赢得本局！`);
      }
      return;
    }

    // ---------- 2) 普通犯规判定 ----------
    let foul = false;
    let foulMsg = '';

    if (shot.cuePotted) {
      foul = true;
      foulMsg = '母球落袋';
    } else if (shot.firstHit === null) {
      foul = true;
      foulMsg = '空杆，没有碰到任何球';
    } else {
      const hitKind = ballKind(shot.firstHit);
      if (shot.targetKind === 'eight') {
        if (hitKind !== 'eight') { foul = true; foulMsg = '黑八阶段必须先碰到黑八'; }
      } else if (shot.targetKind === 'open') {
        if (hitKind === 'eight') { foul = true; foulMsg = '不能先碰黑八'; }
      } else if (hitKind !== shot.targetKind) {
        foul = true;
        foulMsg = hitKind === 'eight' ? '先碰到了黑八' : `先碰到了对方的球（${shot.firstHit} 号）`;
      }
    }

    const potted = shot.potted.filter(p => p.id !== 8);
    const pottedAny = shot.potted.length > 0;

    // ---------- 3) 球组归属（开球/首次进球 → 锁定球组） ----------
    if (!foul && !state.groups[me] && potted.length) {
      let solids = 0;
      let stripes = 0;
      for (const p of potted) {
        if (p.id < 8) solids++;
        else stripes++;
      }
      if (solids && stripes) {
        if (state.mode === 'ai' && me === 1) {
          // 电脑自选：优先选台面上剩余更少的一组
          let solidLeft = 0;
          let stripeLeft = 0;
          for (const b of state.balls) {
            if (!b.active || b.id === 0 || b.id === 8) continue;
            if (b.id < 8) solidLeft++;
            else stripeLeft++;
          }
          assignGroups(1, solidLeft <= stripeLeft ? 'solid' : 'stripe');
        } else {
          // 同时打进纯色 + 花色：由击球方自选
          state.turn = me;
          askGroupChoice(me);
          return;
        }
      } else if (solids) {
        assignGroups(me, 'solid');
      } else {
        assignGroups(me, 'stripe');
      }
      toast(`球组锁定：${state.groups[me] === 'solid' ? '纯色 1-7' : '花色 9-15'}`);
    }

    // ---------- 4) 回合处理 ----------
    state.calledPocket = -1;

    if (foul) {
      // 犯规：提示里点名是谁犯规、犯的什么规，以及谁来拿手中球
      state.lastFoul = `${nameOf(me)} 犯规：${foulMsg}`;
      toast(`${state.lastFoul} · ${nameOf(opp)} 手中球`);
      giveBallInHand(opp);
      state.turn = opp;
      state.phase = 'aim';
      updateStatus();
      maybeStartAI();
      return;
    }

    if (pottedAny) {
      // 进球继续击球
      state.turn = me;
      updateStatus();
      maybeStartAI();
    } else {
      state.turn = opp;
      updateStatus();
      maybeStartAI();
    }
  }

  function askGroupChoice(player) {
    state.phase = 'groupChoice';
    updateStatus();
    showModal('选择球组', '你同时打进了纯色球和花色球，可以自选一组继续。', [
      {
        label: '纯色 1-7',
        onClick: () => {
          assignGroups(player, 'solid');
          state.phase = 'aim';
          updateStatus();
          toast('球组锁定：纯色 1-7');
          maybeStartAI();
        }
      },
      {
        label: '花色 9-15',
        onClick: () => {
          assignGroups(player, 'stripe');
          state.phase = 'aim';
          updateStatus();
          toast('球组锁定：花色 9-15');
          maybeStartAI();
        }
      }
    ]);
  }

  /* ---------- 手中球：母球摆放 ---------- */
  function giveBallInHand(player) {
    const cue = cueBall();
    cue.active = true;
    cue.vx = 0;
    cue.vy = 0;
    state.ballInHand = true;
    const spot = findFreeSpot(HEAD_X - 90, MID_Y);
    cue.x = spot.x;
    cue.y = spot.y;
    state.turn = player;
    state.calledPocket = -1;
  }

  // 判断母球该位置是否合规（不压球、不出界、不在袋口、手中球须在开球区）
  function cueFits(x, y) {
    if (x < TABLE.x + BALL_R || x > TABLE.x + TABLE.w - BALL_R) return false;
    if (y < TABLE.y + BALL_R || y > TABLE.y + TABLE.h - BALL_R) return false;
    if (state.ballInHand && x > HEAD_X) return false;
    for (const p of POCKETS) {
      if (dist(x, y, p.x, p.y) < CAPTURE_R + BALL_R * 0.4) return false;
    }
    for (const b of state.balls) {
      if (!b.active || b.id === 0) continue;
      if (dist(x, y, b.x, b.y) < BALL_R * 2 + 0.6) return false;
    }
    return true;
  }

  // 在指定点附近找一个能放球的位置
  function findFreeSpot(x0, y0) {
    if (cueFits(x0, y0)) return { x: x0, y: y0 };
    for (let r = 18; r <= 460; r += 18) {
      for (let a = 0; a < 24; a++) {
        const ang = a * TAU / 24;
        const x = x0 + Math.cos(ang) * r;
        const y = y0 + Math.sin(ang) * r;
        if (cueFits(x, y)) return { x, y };
      }
    }
    return { x: x0, y: y0 };
  }

  /* ============================================================
   * 10. 胜负判定与本地战绩
   * ============================================================ */
  function endGame(winner, reason) {
    state.gameOver = true;
    state.winner = winner;
    state.phase = 'gameover';
    state.aiming = false;
    state.ballInHand = false;
    state.calledPocket = -1;
    state.locked = false;
    el('btnReplay').disabled = true;
    saveResult(winner);
    updateStatus();
    showModal(`${nameOf(winner)} 获胜`, reason, [
      { label: '一键重新开局', cls: 'primary', onClick: () => resetGame() }
    ]);
  }

  const STORE_KEY = 'eightball.records.v1';

  function defaultRecords() {
    return {
      pvp: { p1: 0, p2: 0 },
      ai: {
        easy: { win: 0, loss: 0 },
        normal: { win: 0, loss: 0 },
        hard: { win: 0, loss: 0 }
      }
    };
  }

  function loadRecords() {
    const base = defaultRecords();
    try {
      const raw = localStorage.getItem(STORE_KEY);
      if (!raw) return base;
      const o = JSON.parse(raw);
      if (o && o.pvp) {
        base.pvp.p1 = Number(o.pvp.p1) || 0;
        base.pvp.p2 = Number(o.pvp.p2) || 0;
      }
      if (o && o.ai) {
        ['easy', 'normal', 'hard'].forEach(k => {
          if (o.ai[k]) {
            base.ai[k].win = Number(o.ai[k].win) || 0;
            base.ai[k].loss = Number(o.ai[k].loss) || 0;
          }
        });
      }
      return base;
    } catch (e) {
      return base;
    }
  }

  let records = loadRecords();

  function saveRecords() {
    try {
      localStorage.setItem(STORE_KEY, JSON.stringify(records));
    } catch (e) { /* 无痕模式等场景忽略 */ }
  }

  function saveResult(winner) {
    if (state.mode === 'pvp') {
      if (winner === 0) records.pvp.p1++;
      else records.pvp.p2++;
    } else {
      const lv = records.ai[state.aiLevel];
      if (winner === 0) lv.win++;
      else lv.loss++;
    }
    saveRecords();
    renderRecords();
  }

  function renderRecords() {
    const rows = [
      `<div class="rec-row"><span class="k">本地双人</span><span class="v">玩家1 <em>${records.pvp.p1}</em> : <em>${records.pvp.p2}</em> 玩家2</span></div>`,
      `<div class="rec-row"><span class="k">人机 · 简单</span><span class="v">我 <em>${records.ai.easy.win}</em> : <em>${records.ai.easy.loss}</em> AI</span></div>`,
      `<div class="rec-row"><span class="k">人机 · 普通</span><span class="v">我 <em>${records.ai.normal.win}</em> : <em>${records.ai.normal.loss}</em> AI</span></div>`,
      `<div class="rec-row"><span class="k">人机 · 困难</span><span class="v">我 <em>${records.ai.hard.win}</em> : <em>${records.ai.hard.loss}</em> AI</span></div>`
    ];
    el('recordsBody').innerHTML = rows.join('');
  }

  // AI 介入钩子（第 5 阶段实现）
  let maybeStartAI = function () {};

  /* ============================================================
   * 11. 电脑对手（简单 / 普通 / 困难）
   * ============================================================ */
  const AI_LEVELS = {
    easy:   { angleErr: 6.0, powerErr: 0.22, planChance: 0.50, delay: 820 },
    normal: { angleErr: 2.2, powerErr: 0.10, planChance: 0.85, delay: 860 },
    hard:   { angleErr: 0.6, powerErr: 0.03, planChance: 1.00, delay: 900 }
  };

  let aiTimer = 0;
  let aiShootTimer = 0;

  // AI 的合法目标球集合
  function aiTargetBalls() {
    const g = state.groups[1];
    const out = [];
    const cleared = g ? remainingOf(1) === 0 : false;
    for (const b of state.balls) {
      if (!b.active || b.id === 0) continue;
      if (!g) {
        if (b.id !== 8) out.push(b);
      } else if (cleared) {
        if (b.id === 8) out.push(b);
      } else if (ballKind(b.id) === g) {
        out.push(b);
      }
    }
    return out;
  }

  // 线段路径是否被其它球挡住
  function pathClear(a, b, ignoreId) {
    const dx = b.x - a.x;
    const dy = b.y - a.y;
    const len = Math.hypot(dx, dy);
    if (len < 1) return true;
    const ux = dx / len;
    const uy = dy / len;

    for (const ball of state.balls) {
      if (!ball.active || ball.id === 0 || ball.id === ignoreId) continue;
      const fx = ball.x - a.x;
      const fy = ball.y - a.y;
      const t = fx * ux + fy * uy;
      if (t < BALL_R * 0.6 || t > len - BALL_R * 0.6) continue;
      const perp = Math.abs(fx * uy - fy * ux);
      if (perp < BALL_R * 2 - 1.5) return false;
    }
    return true;
  }

  // 从指定母球位置搜索最佳进球方案（假想球法）
  function planFrom(cuePos) {
    const targets = aiTargetBalls();
    let best = null;

    for (const ball of targets) {
      for (let pi = 0; pi < POCKETS.length; pi++) {
        const pk = POCKETS[pi];
        const dxp = pk.x - ball.x;
        const dyp = pk.y - ball.y;
        const dp = Math.hypot(dxp, dyp);
        if (dp < 1) continue;

        const pdx = dxp / dp;
        const pdy = dyp / dp;

        // 假想球（母球需要到达的位置）
        const gx = ball.x - pdx * BALL_R * 2;
        const gy = ball.y - pdy * BALL_R * 2;
        if (gx < TABLE.x + BALL_R * 0.5 || gx > TABLE.x + TABLE.w - BALL_R * 0.5) continue;
        if (gy < TABLE.y + BALL_R * 0.5 || gy > TABLE.y + TABLE.h - BALL_R * 0.5) continue;

        const dxc = gx - cuePos.x;
        const dyc = gy - cuePos.y;
        const dc = Math.hypot(dxc, dyc);
        if (dc < BALL_R * 1.2) continue;

        const adx = dxc / dc;
        const ady = dyc / dc;
        const cut = adx * pdx + ady * pdy;   // 切角余弦，越接近 1 越正
        if (cut < 0.22) continue;

        if (!pathClear(cuePos, { x: gx, y: gy }, ball.id)) continue;
        if (!pathClear(ball, pk, ball.id)) continue;

        const score = Math.pow(cut, 2.2) * 1000 / (dc * 0.7 + dp * 1.1 + 60);
        if (!best || score > best.score) {
          best = { score, dir: { x: adx, y: ady }, pocket: pi, dCue: dc, dPot: dp, cut };
        }
      }
    }
    return best;
  }

  // 没有好机会时的保守一杆：直接瞄准最近的己方球，保证合法碰球
  function planSafe(cue) {
    const targets = aiTargetBalls();
    if (!targets.length) {
      return { dir: { x: Math.random() < 0.5 ? -1 : 1, y: (Math.random() - 0.5) }, power: 0.45, pocket: -1 };
    }
    let t = targets[0];
    let bd = Infinity;
    for (const b of targets) {
      const d = dist(cue.x, cue.y, b.x, b.y);
      if (d < bd) { bd = d; t = b; }
    }
    const dx = t.x - cue.x;
    const dy = t.y - cue.y;
    const d = Math.hypot(dx, dy) || 1;
    return { dir: { x: dx / d, y: dy / d }, power: clamp(d / 900 + 0.34, 0.3, 0.9), pocket: -1 };
  }

  function planBreak(cue) {
    let apex = null;
    for (const b of state.balls) {
      if (!b.active || b.id === 0) continue;
      if (!apex || b.x < apex.x) apex = b;
    }
    if (!apex) return { dir: { x: 1, y: 0 }, power: 0.9, pocket: -1 };
    const dx = apex.x - cue.x;
    const dy = apex.y - cue.y;
    const d = Math.hypot(dx, dy) || 1;
    return { dir: { x: dx / d, y: dy / d }, power: 0.94, pocket: -1 };
  }

  // 综合出杆方案（含力度换算）
  function aiPlan() {
    const cue = cueBall();
    if (!state.breakDone) return planBreak(cue);
    const cfg = AI_LEVELS[state.aiLevel] || AI_LEVELS.normal;
    const best = planFrom({ x: cue.x, y: cue.y });
    if (best && Math.random() < cfg.planChance) {
      // 目标球需要滚到袋口 → 反推母球初速
      const vPot = Math.sqrt(2 * ROLL_DECEL * best.dPot * 1.9) + 40;
      const vContact = vPot / Math.max(0.32, best.cut);
      const v0 = Math.sqrt(vContact * vContact + 2 * ROLL_DECEL * best.dCue);
      return { dir: best.dir, power: clamp(v0 / MAX_SPEED * 1.06, 0.16, 1), pocket: best.pocket };
    }
    return planSafe(cue);
  }

  // 手中球：在开球区内挑一个能形成最好进攻角度的位置
  function aiPlaceCue() {
    const cue = cueBall();
    let best = null;
    for (let x = TABLE.x + BALL_R + 8; x <= HEAD_X - 8; x += 44) {
      for (let y = TABLE.y + BALL_R + 8; y <= TABLE.y + TABLE.h - BALL_R - 8; y += 44) {
        if (!cueFits(x, y)) continue;
        const plan = planFrom({ x, y });
        const score = plan ? plan.score : -1;
        if (!best || score > best.score) best = { x, y, score };
      }
    }
    if (best) {
      cue.x = best.x;
      cue.y = best.y;
    }
  }

  function nearestPocketToEight() {
    const b = state.balls.find(x => x.id === 8);
    let idx = 0;
    let bd = Infinity;
    POCKETS.forEach((p, i) => {
      const d = dist(b.x, b.y, p.x, p.y);
      if (d < bd) { bd = d; idx = i; }
    });
    return idx;
  }

  // 电脑回合：思考 → 瞄准展示 → 出杆
  function aiTakeTurn() {
    if (state.mode !== 'ai' || state.turn !== 1 || state.gameOver || state.phase !== 'aim') {
      state.locked = false;
      updateStatus();
      return;
    }

    const cfg = AI_LEVELS[state.aiLevel] || AI_LEVELS.normal;

    if (state.ballInHand) aiPlaceCue();

    const plan = aiPlan();
    const err = (Math.random() * 2 - 1) * cfg.angleErr * Math.PI / 180;
    const angle = Math.atan2(plan.dir.y, plan.dir.x) + err;
    state.aimDir = { x: Math.cos(angle), y: Math.sin(angle) };

    if (isOnEight(1)) {
      state.calledPocket = plan.pocket >= 0 ? plan.pocket : nearestPocketToEight();
    }

    const power = clamp(plan.power * (1 + (Math.random() * 2 - 1) * cfg.powerErr), 0.12, 1);
    state.aiming = true;
    state.power = power;
    updatePowerUI();
    updateStatus();

    clearTimeout(aiShootTimer);
    aiShootTimer = setTimeout(() => {
      state.aiming = false;
      if (state.turn === 1 && state.phase === 'aim' && !state.gameOver) {
        shoot(power);
      }
      updatePowerUI();
    }, 420);
  }

  maybeStartAI = function () {
    clearTimeout(aiTimer);
    clearTimeout(aiShootTimer);
    state.locked = false;
    if (state.mode !== 'ai' || state.turn !== 1 || state.gameOver || state.phase !== 'aim') {
      updateStatus();
      return;
    }
    state.locked = true;      // 锁定玩家操作
    updateStatus();
    aiTimer = setTimeout(aiTakeTurn, (AI_LEVELS[state.aiLevel] || AI_LEVELS.normal).delay);
  };

  /* ============================================================
   * 12. 音效（WebAudio 合成，无需外部资源）
   * ============================================================ */
  const SOUND_KEY = 'eightball.sound.v1';

  const Sound = {
    ctx: null,
    enabled: true,

    init() {
      if (this.ctx) return;
      const AC = window.AudioContext || window.webkitAudioContext;
      if (!AC) return;
      try { this.ctx = new AC(); } catch (e) { this.ctx = null; }
    },

    resume() {
      if (this.ctx && this.ctx.state === 'suspended') {
        try { this.ctx.resume(); } catch (e) { /* 忽略 */ }
      }
    },

    tone(freq, dur, vol, type, slideTo) {
      const c = this.ctx;
      if (!c || !this.enabled) return;
      const t = c.currentTime;
      const osc = c.createOscillator();
      const gain = c.createGain();
      osc.type = type || 'triangle';
      osc.frequency.setValueAtTime(freq, t);
      if (slideTo) osc.frequency.exponentialRampToValueAtTime(Math.max(40, slideTo), t + dur);
      gain.gain.setValueAtTime(0.0001, t);
      gain.gain.exponentialRampToValueAtTime(Math.max(0.0005, vol), t + 0.005);
      gain.gain.exponentialRampToValueAtTime(0.0001, t + dur);
      osc.connect(gain);
      gain.connect(c.destination);
      osc.start(t);
      osc.stop(t + dur + 0.03);
    },

    noise(dur, vol, freq) {
      const c = this.ctx;
      if (!c || !this.enabled) return;
      const len = Math.max(1, Math.floor(c.sampleRate * dur));
      const buf = c.createBuffer(1, len, c.sampleRate);
      const data = buf.getChannelData(0);
      for (let i = 0; i < len; i++) {
        data[i] = (Math.random() * 2 - 1) * Math.pow(1 - i / len, 2);
      }
      const src = c.createBufferSource();
      src.buffer = buf;
      const filter = c.createBiquadFilter();
      filter.type = 'bandpass';
      filter.frequency.value = freq || 2000;
      filter.Q.value = 0.8;
      const gain = c.createGain();
      gain.gain.value = vol;
      src.connect(filter);
      filter.connect(gain);
      gain.connect(c.destination);
      src.start();
    },

    // 出杆：皮头撞击 + 木质闷响
    cue(power) {
      this.noise(0.08, 0.10 + power * 0.20, 1500);
      this.tone(180, 0.07, 0.05 + power * 0.10, 'square', 90);
    },

    // 球与球 / 球与库边：清脆撞击，强度越大越响越尖
    hit(strength) {
      const v = clamp(strength, 0, 1);
      this.tone(760 + v * 620, 0.045 + v * 0.03, 0.05 + v * 0.20, 'triangle', 420);
    },

    // 落袋：低频下坠 + 短促杂音
    pocket(isCue) {
      this.tone(isCue ? 90 : 150, 0.22, 0.20, 'sine', 55);
      this.noise(0.16, 0.10, 400);
    }
  };

  // 挂接物理层音效钩子
  sfxCue = function (power) { Sound.cue(power); };
  sfxHit = function (v) { Sound.hit(v); };
  sfxPocket = function (isCue) { Sound.pocket(isCue); };

  function updateSoundBtn() {
    el('btnSound').textContent = '音效：' + (Sound.enabled ? '开' : '关');
  }

  function saveSound() {
    try { localStorage.setItem(SOUND_KEY, Sound.enabled ? '1' : '0'); } catch (e) { /* 忽略 */ }
  }

  /* ============================================================
   * 13. 上一杆回放
   * ============================================================ */
  const MAX_REPLAY_FRAMES = 2400;   // 约 40 秒
  let replayData = null;
  let replayIdx = 0;
  let replayAcc = 0;
  let recAcc = 0;

  function snapshotFrame() {
    const arr = new Array(state.balls.length);
    for (let i = 0; i < state.balls.length; i++) {
      const b = state.balls[i];
      arr[i] = [Math.round(b.x * 10) / 10, Math.round(b.y * 10) / 10, b.active ? 1 : 0];
    }
    return arr;
  }

  function startRecording() {
    state.replayFrames = [snapshotFrame()];
    recAcc = 0;
  }

  function tickRecording(dt) {
    if (!state.replayFrames) return;
    recAcc += dt;
    if (recAcc >= 1 / 60) {
      recAcc -= 1 / 60;
      if (state.replayFrames.length < MAX_REPLAY_FRAMES) {
        state.replayFrames.push(snapshotFrame());
      }
    }
  }

  function finishRecording() {
    const frames = state.replayFrames;
    state.replayFrames = null;
    if (frames && frames.length > 4) {
      replayData = { frames };
      el('btnReplay').disabled = false;
    }
  }

  function startReplay() {
    if (!replayData || replayData.frames.length < 4) return;
    if (state.phase !== 'aim' || state.gameOver) return;
    if (state.locked || state.modalOpen) return;
    state.phase = 'replay';
    state.aiming = false;
    state.power = 0;
    updatePowerUI();
    replayIdx = 0;
    replayAcc = 0;
    updateStatus();
    toast('正在回放上一杆');
  }

  function tickReplay(dt) {
    if (!replayData) { state.phase = 'aim'; return; }
    const last = replayData.frames.length - 1;
    if (replayIdx >= last) {
      state.phase = 'aim';
      replayIdx = 0;
      updateStatus();
      maybeStartAI();
      return;
    }
    replayIdx += dt * 60;
    if (replayIdx > last) replayIdx = last;
  }

  /* ============================================================
   * 14. 弹窗与 HUD
   * ============================================================ */
  const el = id => document.getElementById(id);
  const statusTextEl = el('statusText');
  const statusSubEl = el('statusSub');
  const turnDotEl = el('turnDot');
  const powerFillEl = el('powerFill');
  const powerValEl = el('powerVal');
  const toastEl = el('toast');
  const modalEl = el('modal');
  const modalTitleEl = el('modalTitle');
  const modalTextEl = el('modalText');
  const modalActionsEl = el('modalActions');

  let toastTimer = 0;
  function toast(msg, ms) {
    toastEl.textContent = msg;
    toastEl.classList.add('show');
    clearTimeout(toastTimer);
    toastTimer = setTimeout(() => toastEl.classList.remove('show'), ms || 1600);
  }

  function showModal(title, text, actions) {
    modalTitleEl.textContent = title;
    modalTextEl.textContent = text || '';
    modalActionsEl.innerHTML = '';
    (actions || []).forEach(a => {
      const btn = document.createElement('button');
      btn.type = 'button';
      btn.className = 'btn ' + (a.cls || '');
      btn.textContent = a.label;
      btn.addEventListener('click', () => {
        if (a.keepOpen) { a.onClick && a.onClick(); return; }
        hideModal();
        a.onClick && a.onClick();
      });
      modalActionsEl.appendChild(btn);
    });
    modalEl.classList.add('show');
    state.modalOpen = true;
  }

  function hideModal() {
    modalEl.classList.remove('show');
    state.modalOpen = false;
  }

  function updatePowerUI() {
    const pct = Math.round(state.power * 100);
    powerFillEl.style.width = pct + '%';
    powerValEl.textContent = pct + '%';
  }

  function updateStatus() {
    const isAI = state.mode === 'ai';
    const p = state.turn;
    const name = nameOf(p);
    let title = `${name} 击球`;
    let sub = '';

    if (state.phase === 'shooting') {
      title = '球在运动中…';
      sub = '所有球静止后才可继续击球';
    } else if (state.phase === 'replay') {
      title = '上一杆回放中…';
      sub = '回放结束后可继续击球';
    } else if (state.phase === 'gameover') {
      title = `${nameOf(state.winner)} 获胜`;
      sub = '点击「一键重新开局」再战一局';
    } else if (state.phase === 'groupChoice') {
      title = '请选择球组';
      sub = '同时打进纯色与花色球，可自选一组';
    }

    if (state.phase === 'aim' && state.ballInHand) {
      title = `${name} · 手中球`;
      sub = (state.lastFoul ? state.lastFoul + ' · ' : '') +
        (isAI && p === 1 ? '电脑正在摆放母球' : '在开球区拖动母球摆放，再拖拽瞄准击球');
    } else if (state.phase === 'aim' && isAI && p === 1) {
      title = '电脑瞄准中';
      sub = '电脑回合，玩家操作已锁定';
    } else if (state.phase === 'aim' && isOnEight(p)) {
      sub = state.calledPocket >= 0
        ? `目标：黑八 · 已指定${POCKET_NAMES[state.calledPocket]}，拖拽瞄准`
        : '目标：黑八 · 先点击袋口指定目标袋';
    } else if (state.phase === 'aim' && !state.groups[p]) {
      sub = '目标：待定（开球后首个合法进球锁定球组）· 反方向拖拽瞄准';
    } else if (state.phase === 'aim') {
      const left = remainingOf(p);
      sub = `目标：${state.groups[p] === 'solid' ? '纯色 1-7' : '花色 9-15'}（剩 ${left} 颗）· 反方向拖拽瞄准`;
    }

    statusTextEl.textContent = title;
    statusSubEl.textContent = sub;
    statusSubEl.className = 'sub' +
      (state.phase === 'aim' && state.lastFoul ? ' warn' : '');
    turnDotEl.className = 'dot' + (isAI && p === 1 ? ' ai' : '') + (state.ballInHand ? ' warn' : '');
  }

  function resetGame() {
    setupBalls();
    state.turn = 0;
    state.groups = [null, null];
    state.phase = 'aim';
    state.aiming = false;
    state.power = 0;
    state.locked = false;
    state.gameOver = false;
    state.winner = null;
    state.shot = null;
    state.calledPocket = -1;
    state.ballInHand = true;   // 开球：母球可先在开球区内摆放
    state.breakDone = false;
    state.lastFoul = null;
    state.aimDir = { x: 1, y: 0 };
    physAcc = 0;
    activePointer = null;
    clearTimeout(aiTimer);
    clearTimeout(aiShootTimer);
    replayData = null;
    replayIdx = 0;
    state.replayFrames = null;
    el('btnReplay').disabled = true;
    hideModal();
    updateStatus();
    updatePowerUI();
  }

  // 模式 / 难度切换
  el('modeSeg').addEventListener('click', e => {
    const btn = e.target.closest('button');
    if (!btn) return;
    const mode = btn.dataset.mode;
    if (mode === state.mode) return;
    state.mode = mode;
    [...el('modeSeg').children].forEach(b => b.classList.toggle('active', b === btn));
    el('levelSeg').hidden = mode !== 'ai';
    resetGame();
    toast(mode === 'ai' ? '人机对战：玩家 1 先开球' : '本地双人轮流');
  });

  el('levelSeg').addEventListener('click', e => {
    const btn = e.target.closest('button');
    if (!btn) return;
    state.aiLevel = btn.dataset.level;
    [...el('levelSeg').children].forEach(b => b.classList.toggle('active', b === btn));
    resetGame();
    toast('难度：' + btn.textContent);
  });

  el('btnRestart').addEventListener('click', () => {
    resetGame();
    toast('重新开局');
  });

  // 上一杆回放
  el('btnReplay').addEventListener('click', startReplay);

  // 音效开关
  el('btnSound').addEventListener('click', () => {
    Sound.enabled = !Sound.enabled;
    saveSound();
    updateSoundBtn();
    if (Sound.enabled) {
      Sound.init();
      Sound.resume();
    }
    toast(Sound.enabled ? '音效已开启' : '音效已关闭');
  });

  // 清空战绩（带确认提示）
  el('btnClear').addEventListener('click', () => {
    showModal('清空战绩', '将清除本地保存的全部战绩记录（含双人与人机），此操作不可撤销。', [
      { label: '取消', onClick: () => {} },
      {
        label: '确定清空',
        cls: 'danger',
        onClick: () => {
          records = defaultRecords();
          saveRecords();
          renderRecords();
          toast('本地战绩已清空');
        }
      }
    ]);
  });

  /* ============================================================
   * 15. 主循环
   * ============================================================ */
  let lastTime = performance.now();

  function frame(now) {
    const dt = Math.min((now - lastTime) / 1000, 0.05);
    lastTime = now;
    update(dt);
    render();
    requestAnimationFrame(frame);
  }

  function update(dt) {
    if (state.phase === 'shooting') {
      stepPhysics(dt);
      tickRecording(dt);
      if (allStopped()) {
        state.settleTimer += dt;
        if (state.settleTimer > 0.22) endShot();
      } else {
        state.settleTimer = 0;
      }
    } else if (state.phase === 'replay') {
      tickReplay(dt);
    }
  }

  /* ============================================================
   * 16. 启动
   * ============================================================ */
  function boot() {
    resizeCanvas();
    setupBalls();
    renderRecords();
    try {
      Sound.enabled = localStorage.getItem(SOUND_KEY) !== '0';
    } catch (e) { /* 忽略 */ }
    updateSoundBtn();
    el('btnReplay').disabled = true;
    updateStatus();
    updatePowerUI();
    requestAnimationFrame(time => { lastTime = time; frame(time); });
  }

  boot();
})();
</script>
</body>
</html>
